plugins {
    id 'com.android.application'
}

android {
    namespace 'com.endroid.screenoff'
    compileSdk 34

    defaultConfig {
        applicationId "com.endroid.screenoff"
        minSdk 28
        targetSdk 34
        versionCode 12
        versionName "1.4.2"
        resourceConfigurations += ['en']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
    def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
    def hasReleaseKey = releaseStoreFile != null && !releaseStoreFile.isEmpty() \
        && releaseStorePassword != null && !releaseStorePassword.isEmpty() \
        && releaseKeyAlias != null && !releaseKeyAlias.isEmpty() \
        && releaseKeyPassword != null && !releaseKeyPassword.isEmpty() \
        && file(releaseStoreFile).exists()

    signingConfigs {
        debugLocal {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debugLocal
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
